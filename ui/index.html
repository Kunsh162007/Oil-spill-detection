<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ff5c39'/%3E%3C/svg%3E" />
  <title>Oil Spill Detection &amp; Vessel Attribution</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <div style="position:relative">
      <div class="topbar">
        <div class="brand">
          <h1>Oil Spill Detection &amp; Vessel Attribution</h1>
          <span class="tag">SIH 2026 &middot; SIH26143 &middot; NTRO</span>
        </div>
        <div class="timeliness" id="timeliness">near-real-time &middot; not live</div>
      </div>
      <div id="map"></div>
      <div class="legend">
        <h4>Legend</h4>
        <div class="legend-row"><span class="swatch dot" style="background:#ff5c39"></span> Confirmed oil slick</div>
        <div class="legend-row"><span class="swatch dot" style="background:#6b7a90"></span> Rejected look-alike</div>
        <div class="legend-row"><span class="swatch dot" style="background:#35d0ba"></span> Estimated origin</div>
        <div class="legend-row"><span class="swatch" style="background:#35d0ba"></span> Backward drift path</div>
        <div class="legend-row"><span class="swatch" style="background:#4c8dff"></span> Vessel track</div>
        <div class="legend-row"><span class="swatch" style="background:#c65cff"></span> Track with AIS gap</div>
      </div>
    </div>

    <aside id="panel">
      <div class="panel-head">
        <h2 id="panel-title">Detected slicks</h2>
        <p id="panel-sub">Loading&hellip;</p>
      </div>
      <div class="panel-body" id="panel-body">
        <div class="spinner">Analysing scenes&hellip;</div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
