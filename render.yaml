# Render blueprint - free tier.
#
# One service that serves both the API and the UI. The two-tier split still
# exists (SERVE_UI=false turns this into a pure API), but running them as one
# service is the right call on a free plan: each free service sleeps after 15
# minutes idle, and two sleeping services means two cold starts per visit.
#
# Free-tier constraints this file works within:
#   * NO persistent disk - disks are a paid feature. Demo scenes and the
#     incident registry are baked into the image at build time, so a cold
#     container still has data. Scenes fetched at runtime are lost on restart.
#   * 512 MB RAM. Enough for the classical detector; not for the U-Net.
#   * Sleeps after 15 min idle; the next request takes ~50 s to wake.
services:
  - type: web
    name: oilspill
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Serve the UI from the same service - see the note above.
      - key: SERVE_UI
        value: "true"
      - key: OILSPILL_CONFIG
        value: configs/demo_synthetic.yaml
      # Same-origin, so no cross-origin calls to allow.
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: INFO
