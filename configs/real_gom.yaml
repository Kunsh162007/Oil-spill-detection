# Real Sentinel-1 scenes over documented Gulf of Mexico spills.
#
# Wind is a measured climatological constant for the region rather than a
# per-pixel ERA5 field: honest, labelled, and enough to exercise the wind
# gate. Run scripts/fetch_wind.py for a real ERA5 field per scene.
stubs:
  stage_b: false

ingest:
  # These scenes carry SMALL slicks - the ground-truth masks are tens of
  # thousands of square metres, not square kilometres. At 80 m/px such a
  # slick is about five pixels and is filtered out as speckle, so this set
  # is worked at 40 m. CLAUDE.md's 80 m default is right for large slicks;
  # the point of that decision was speed, and it is a tunable, not a law.
  target_resolution_m: 40.0
  tile_size: 512
  tile_overlap: 0.25
  speckle_filter: refined_lee
  speckle_window: 7

detect:
  classes: 2                 # the trained checkpoint is binary (sea / oil)
  # The fine-tuned U-Net scores Oil IoU 0.70 on balanced patches but
  # over-predicts badly on whole scenes, where its overlap with the reference
  # masks collapses. Until that is fixed the pipeline uses the classical
  # detector, which is currently producing corroborated detections here.
  # models/stage_b_patchonly.pt holds that checkpoint; point this at it to
  # evaluate the network once scene-level performance has been measured.
  checkpoint: models/stage_b.pt
  stage_a_threshold: 0.12
  stage_b_threshold: 0.55
  min_area_km2: 0.02         # matches the real slick sizes in this dataset
  classical_sensitivity: 2.4

wind:
  # Real ERA5 via the Open-Meteo archive, same as the other real scenes. A
  # constant here would put every Gulf candidate at the same fabricated wind,
  # which is exactly what made the earlier numbers meaningless.
  source: open-meteo
  cache_dir: data/wind/openmeteo

lookalike:
  p_oil_threshold: 0.5

drift:
  # One CMEMS field per scene. This config is shared by the MC-20 pass and the
  # Galveston shipping-lane pass, which are 500 km apart - a single
  # currents_path would silently give one of them the other's ocean.
  currents_source: cmems
  currents_dir: data/currents
  # Real CMEMS currents for the MC-20 pass.
  backend: auto
  backtrack_hours: 12.0
  timestep_minutes: 30.0
  n_particles: 200

attribute:
  search_radius_km: 50.0
  top_n: 3

decision:
  abstain_margin: 0.08
  min_top_score: 0.35

incidents:
  path: data/reference/noaa_incidents.csv
